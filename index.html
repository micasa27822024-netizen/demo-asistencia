<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Asistencia - Control de Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col relative">

  <div id="flash-overlay" class="fixed inset-0 bg-white pointer-events-none z-50 transition-opacity duration-100 opacity-0 hidden"></div>

  <header class="bg-slate-900 border-b border-slate-800 shadow-md mb-4">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-slate-800 border border-emerald-500/30 rounded-xl flex items-center justify-center overflow-hidden shadow-inner p-1">
          <i class="fa-solid fa-shield-halved text-white text-lg"></i>
        </div>
        <div>
          <span class="text-[10px] font-extrabold tracking-widest text-emerald-400 uppercase block">Demo Asistencia</span>
          <h1 class="text-lg font-bold text-white tracking-wide">Fichadas</h1>
        </div>
      </div>

      <nav class="flex flex-wrap justify-center items-center gap-1 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60">
        <a href="index.html" class="px-3 py-1.5 text-xs font-medium text-white bg-slate-700 rounded-lg transition flex items-center space-x-1.5 shadow-sm">
          <i class="fa-solid fa-camera-retro text-emerald-400"></i>
          <span>Fichadas</span>
        </a>
        <a href="admin.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-building-shield text-emerald-400"></i>
          <span>Centro de Operaciones</span>
        </a>
        <a href="panel.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-chart-line text-emerald-400"></i>
          <span>Control en Tiempo Real</span>
        </a>
        <a href="mis-horas.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-clock text-emerald-400"></i>
          <span>Control de Mis Horas</span>
        </a>
      </nav>

    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-white tracking-wide uppercase">Registro de Asistencia</h2>
        <span id="estadoRed" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30">🟢 Online</span>
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">N° Legajo</label>
        <div class="relative">
          <input type="text" id="legajo" onblur="validarLegajo()" placeholder="Ingrese su legajo (ej: 0286)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
          <button type="button" onclick="validarLegajo()" class="absolute right-2 top-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2 py-1 rounded">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <p id="legajo-status" class="text-xs mt-1 hidden"></p>
        <p id="ultimo-estado-badge" class="text-xs mt-1.5 font-semibold hidden"></p>
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Nombre Completo</label>
        <input type="text" id="nombre" readonly placeholder="Se autocompletará con su legajo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-400 cursor-not-allowed">
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">PIN / Clave de Personal</label>
        <input type="password" id="pin" maxlength="6" placeholder="****" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Objetivo / Puesto</label>
        <select id="objetivo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
          <option value="">Cargando objetivos...</option>
        </select>
      </div>

      <div class="space-y-2">
        <label class="block text-xs uppercase text-slate-400">Validación Facial IA</label>
        <div class="relative w-full h-48 bg-slate-950 rounded-lg overflow-hidden border border-slate-700 flex items-center justify-center">
          <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
          <canvas id="canvas" class="hidden"></canvas>
          <img id="preview" class="w-full h-full object-cover hidden absolute inset-0 border-2 border-emerald-500">
        </div>
        <button type="button" id="btnCapturar" onclick="capturarFoto()" class="w-full bg-amber-600 hover:bg-amber-500 text-xs py-2 rounded-lg font-bold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-camera"></i> CAPTURAR Y VALIDAR ROSTRO
        </button>
        <p id="foto-status" class="text-xs text-rose-400 text-center font-semibold">⚠️ Foto no capturada</p>
      </div>

      <div class="grid grid-cols-2 gap-4 pt-2">
        <button onclick="procesarEnvio('ENTRADA')" class="bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition">ENTRADA</button>
        <button onclick="procesarEnvio('SALIDA')" class="bg-rose-600 hover:bg-rose-500 font-bold py-3 rounded-xl transition">SALIDA</button>
      </div>

      <div id="resultado" class="hidden p-3 rounded-xl text-xs text-center"></div>
    </div>
  </main>

  <script>
    const URL_FIREBASE = "https://fir-asistencia-fad12-default-rtdb.firebaseio.com";
    
    let fotoBase64Global = "";
    let estaSincronizando = false;
    let ultimoTipoFichadaGlobal = "";
    let fotoMasterGuardada = null;
    let modelosCargados = false;
    let resultadoSimilitudGlobal = "NO_EVALUADO";
    
    // VARIABLES PARA AUDITORÍA Y BANDERAS ANTI-SPOOFING DE FONDO
    let distanciaEuclidianaGlobal = null;
    let sospechaFraudeGlobal = false;
    let motivoSospechaGlobal = "";

    window.onload = async function() {
      iniciarCamaraSegura();
      cargarObjetivos();
      actualizarEstadoRed();
      cargarModelosIA();

      if (navigator.onLine) {
        sincronizarFichadasPendientes();
      }
    };

    // CARGAR MODELOS DESDE LA CARPETA LOCAL /models
    async function cargarModelosIA() {
      const status = document.getElementById('foto-status');
      status.innerText = "⏳ Cargando modelos de Inteligencia Artificial...";
      status.className = "text-xs text-amber-400 text-center font-semibold";
      
      try {
        const MODEL_URL = './models';

        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        modelosCargados = true;
        status.innerText = "⚠️ Foto no capturada (IA Lista)";
        status.className = "text-xs text-rose-400 text-center font-semibold";
        console.log("✅ Modelos de IA cargados con éxito desde la carpeta local.");
      } catch (err) {
        console.error("Error al cargar modelos de la IA:", err);
        modelosCargados = false;
        status.innerText = "⚠️ Modo IA no disponible (Error al cargar modelos)";
        status.className = "text-xs text-amber-400 text-center font-semibold";
      }
    }

    window.addEventListener('online', () => {
      actualizarEstadoRed();
      sincronizarFichadasPendientes();
    });
    
    window.addEventListener('offline', actualizarEstadoRed);

    function iniciarCamaraSegura() {
      const status = document.getElementById('foto-status');
      
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
          .then(stream => { 
            document.getElementById('webcam').srcObject = stream; 
          })
          .catch(err => {
            console.warn("No se pudo iniciar la cámara automáticamente: ", err);
            status.innerText = "⚠️ Cámara pausada o sin permisos (pulse Capturar Foto)";
          });
      } else {
        status.innerText = "⚠️ Su navegador no soporta el acceso a la cámara";
      }
    }

    function actualizarEstadoRed() {
      const indicador = document.getElementById('estadoRed');
      if (!indicador) return;
      if (navigator.onLine) {
        indicador.className = "text-[11px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30";
        indicador.innerText = "🟢 Online";
      } else {
        indicador.className = "text-[11px] font-semibold px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-500/30";
        indicador.innerText = "⚠️ Modo Offline";
      }
    }

    function cargarObjetivos() {
      const selectObj = document.getElementById('objetivo');
      let objetivosGuardados = JSON.parse(localStorage.getItem('demo_lista_objetivos') || '[]');

      if (objetivosGuardados.length > 0) {
        poblarSelectObjetivos(objetivosGuardados);
      }

      if (navigator.onLine) {
        fetch(`${URL_FIREBASE}/objetivos.json`)
          .then(res => res.json())
          .then(data => {
            if (data) {
              let listaNuevos = [];
              Object.values(data).forEach(item => {
                const nombreObj = item.nombre || item.codigo;
                if (nombreObj) listaNuevos.push(nombreObj);
              });
              
              if (listaNuevos.length > 0) {
                localStorage.setItem('demo_lista_objetivos', JSON.stringify(listaNuevos));
                poblarSelectObjetivos(listaNuevos);
              }
            }
          })
          .catch(err => console.warn("No se pudieron actualizar los objetivos desde Firebase:", err));
      } else if (objetivosGuardados.length === 0) {
        selectObj.innerHTML = '<option value="Objetivo Principal">Objetivo Principal (Modo Offline)</option><option value="Puesto General">Puesto General</option>';
      }
    }

    function poblarSelectObjetivos(lista) {
      const selectObj = document.getElementById('objetivo');
      let ultimoElegido = localStorage.getItem('demo_ultimo_objetivo') || '';
      
      selectObj.innerHTML = '<option value="">Seleccione un Objetivo</option>';
      
      lista.forEach(nombreObj => {
        const opt = document.createElement('option');
        opt.value = nombreObj;
        opt.textContent = nombreObj;
        if (nombreObj === ultimoElegido) {
          opt.selected = true;
        }
        selectObj.appendChild(opt);
      });
    }

    function validarLegajo() {
      const legajoInput = document.getElementById('legajo').value.trim();
      const statusLbl = document.getElementById('legajo-status');
      const badgeEstado = document.getElementById('ultimo-estado-badge');
      fotoMasterGuardada = null;
      
      if (!legajoInput) {
        badgeEstado.classList.add('hidden');
        ultimoTipoFichadaGlobal = "";
        return;
      }

      if (!navigator.onLine) {
        statusLbl.className = "text-xs mt-1 text-slate-400 block";
        statusLbl.innerText = "Modo Offline: Verificación en servidor omitida.";
        verificarUltimoEstadoLocal(legajoInput);
        return;
      }

      statusLbl.className = "text-xs mt-1 text-amber-400 block";
      statusLbl.innerText = "Buscando legajo y foto oficial...";

      Promise.all([
        fetch(`${URL_FIREBASE}/personal.json`).then(res => res.json()).catch(() => null),
        fetch(`${URL_FIREBASE}/fichadas.json`).then(res => res.json()).catch(() => null)
      ])
      .then(([dataPersonal, dataFichadas]) => {
        let encontrado = null;
        if (dataPersonal) {
          if (dataPersonal[legajoInput]) {
            encontrado = dataPersonal[legajoInput];
          } else {
            Object.values(dataPersonal).forEach(personal => {
              if (String(personal.legajo).trim() === String(legajoInput)) {
                encontrado = personal;
              }
            });
          }
        }

        if (encontrado) {
          document.getElementById('nombre').value = encontrado.nombre || "";
          fotoMasterGuardada = encontrado.fotoMaster || null;
          statusLbl.className = "text-xs mt-1 text-emerald-400 block";
          statusLbl.innerText = `✓ ${encontrado.nombre || 'Legajo Encontrado'} ${fotoMasterGuardada ? '📸 (Foto Master OK)' : '⚠️ (Sin Foto Master)'}`;
        } else {
          document.getElementById('nombre').value = "";
          statusLbl.className = "text-xs mt-1 text-rose-400 block";
          statusLbl.innerText = "❌ Legajo no encontrado en el sistema.";
        }

        let ultimaFichadaTipo = "";
        let timestampUltimo = 0;

        if (dataFichadas) {
          Object.values(dataFichadas).forEach(f => {
            if (String(f.legajo).trim() === String(legajoInput)) {
              let tiempoFichada = f.fechaHoraDispositivo ? new Date(f.fechaHoraDispositivo).getTime() : 0;
              if (tiempoFichada >= timestampUltimo) {
                timestampUltimo = tiempoFichada;
                ultimaFichadaTipo = String(f.tipo || "").trim().toUpperCase();
              }
            }
          });
        }

        let pendientes = JSON.parse(localStorage.getItem('fichadas_pendientes') || '[]');
        pendientes.forEach(p => {
          if (String(p.legajo).trim() === String(legajoInput)) {
            let tiempoP = p.fechaHoraDispositivo ? new Date(p.fechaHoraDispositivo).getTime() : 0;
            if (tiempoP >= timestampUltimo) {
              timestampUltimo = tiempoP;
              ultimaFichadaTipo = String(p.tipo || "").trim().toUpperCase();
            }
          }
        });

        ultimoTipoFichadaGlobal = ultimaFichadaTipo;

        if (ultimaFichadaTipo) {
          badgeEstado.classList.remove('hidden');
          if (ultimaFichadaTipo === 'ENTRADA') {
            badgeEstado.className = "text-xs mt-1.5 font-semibold text-emerald-400 block";
            badgeEstado.innerText = "ℹ️ Estado actual: Ya registraste una ENTRADA. Tu próxima acción debe ser SALIDA.";
          } else {
            badgeEstado.className = "text-xs mt-1.5 font-semibold text-slate-400 block";
            badgeEstado.innerText = "ℹ️ Estado actual: Última fichada fue SALIDA. Puedes marcar ENTRADA.";
          }
        } else {
          badgeEstado.classList.add('hidden');
        }

      })
      .catch(() => {
        statusLbl.className = "text-xs mt-1 text-slate-400 block";
        statusLbl.innerText = "Error de conexión al validar legajo.";
      });
    }

    function verificarUltimoEstadoLocal(legajoInput) {
      let ultimaFichadaTipo = "";
      let timestampUltimo = 0;
      let pendientes = JSON.parse(localStorage.getItem('fichadas_pendientes') || '[]');
      
      pendientes.forEach(p => {
        if (String(p.legajo).trim() === String(legajoInput)) {
          let tiempoP = p.fechaHoraDispositivo ? new Date(p.fechaHoraDispositivo).getTime() : 0;
          if (tiempoP >= timestampUltimo) {
            timestampUltimo = tiempoP;
            ultimaFichadaTipo = String(p.tipo || "").trim().toUpperCase();
          }
        }
      });

      ultimoTipoFichadaGlobal = ultimaFichadaTipo;
      const badgeEstado = document.getElementById('ultimo-estado-badge');

      if (ultimaFichadaTipo) {
        badgeEstado.classList.remove('hidden');
        if (ultimaFichadaTipo === 'ENTRADA') {
          badgeEstado.className = "text-xs mt-1.5 font-semibold text-emerald-400 block";
          badgeEstado.innerText = "ℹ️ Estado actual (Offline): Tienes una ENTRADA pendiente.";
        } else {
          badgeEstado.className = "text-xs mt-1.5 font-semibold text-slate-400 block";
          badgeEstado.innerText = "ℹ️ Estado actual (Offline): Última fichada fue SALIDA.";
        }
      } else {
        badgeEstado.classList.add('hidden');
      }
    }

    async function capturarFoto() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const preview = document.getElementById('preview');
      const status = document.getElementById('foto-status');
      const btn = document.getElementById('btnCapturar');
      const flashOverlay = document.getElementById('flash-overlay');

      if (!video.srcObject && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
          video.srcObject = stream;
        } catch(err) {
          alert("No se pudo acceder a la cámara. Verifique los permisos del navegador.");
          return;
        }
      }

      btn.disabled = true;
      status.innerText = "🔍 Analizando rostro e identidad con IA...";
      status.className = "text-xs text-amber-400 text-center font-semibold";

      // 1. DISPARAR FLASH INVISIBLE ANTI-SPOOFING (150 ms)
      flashOverlay.classList.remove('hidden');
      flashOverlay.classList.remove('opacity-0');
      flashOverlay.classList.add('opacity-100');

      setTimeout(async () => {
        await realizarCapturaIA(video, canvas, preview, status);
        
        // Apagar el flash
        flashOverlay.classList.remove('opacity-100');
        flashOverlay.classList.add('opacity-0');
        setTimeout(() => flashOverlay.classList.add('hidden'), 100);

        btn.disabled = false;
      }, 150);
    }

    async function realizarCapturaIA(video, canvas, preview, status) {
      const MAX_WIDTH = 320;
      const originalWidth = video.videoWidth || 640;
      const originalHeight = video.videoHeight || 480;

      let targetWidth = MAX_WIDTH;
      let targetHeight = Math.round((originalHeight * MAX_WIDTH) / originalWidth);

      canvas.width = targetWidth;
      canvas.height = targetHeight;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, targetWidth, targetHeight);

      // Reiniciar variables de auditoría de fondo
      distanciaEuclidianaGlobal = null;
      sospechaFraudeGlobal = false;
      motivoSospechaGlobal = "Ninguna";

      if (!modelosCargados) {
        fotoBase64Global = canvas.toDataURL('image/jpeg', 0.35);
        preview.src = fotoBase64Global;
        preview.classList.remove('hidden');
        resultadoSimilitudGlobal = "IA_NO_DISPONIBLE";
        status.innerText = "⚠️ Foto capturada sin análisis facial de IA.";
        status.className = "text-xs text-amber-400 text-center font-semibold";
        return;
      }

      // 1. DETECTAR ROSTRO Y EXTRAER VECTOR MATEMÁTICO DE LA SELFIE
      const deteccionSelfie = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions())
                                          .withFaceLandmarks()
                                          .withFaceDescriptor();

      if (!deteccionSelfie) {
        status.innerText = "❌ Rechazado: No se detecta un rostro humano claro (evite tapar la cámara o fotos al techo).";
        status.className = "text-xs text-rose-400 text-center font-semibold";
        preview.classList.add('hidden');
        fotoBase64Global = "";
        return;
      }

      // 2. COMPARAR CON FOTO MASTER (SI EXISTE)
      if (fotoMasterGuardada) {
        try {
          const imgMaster = new Image();
          imgMaster.crossOrigin = "anonymous";
          imgMaster.src = fotoMasterGuardada;
          await imgMaster.decode();

          const deteccionMaster = await faceapi.detectSingleFace(imgMaster, new faceapi.TinyFaceDetectorOptions())
                                               .withFaceLandmarks()
                                               .withFaceDescriptor();

          if (deteccionMaster) {
            const distancia = faceapi.euclideanDistance(deteccionSelfie.descriptor, deteccionMaster.descriptor);
            const porcentajeSimilitud = Math.round((1 - distancia) * 100);
            distanciaEuclidianaGlobal = distancia.toFixed(4);

            // UMBRAL MÁS STRICTO PARA ENTRADA EN VIVO (Máximo 0.45 = Aprox 75-80% Similitud)
            if (distancia > 0.45) {
              status.innerText = `❌ Rechazado: Suplantación de identidad. El rostro no coincide con el legajo (${porcentajeSimilitud}% sim).`;
              status.className = "text-xs text-rose-400 text-center font-semibold";
              preview.classList.add('hidden');
              fotoBase64Global = "";
              return;
            }

            // BANDERA PARA AUDITORÍA DE FONDO (Si la distancia está entre 0.38 y 0.45 la marca como sospechosa de pantalla)
            if (distancia > 0.38) {
              sospechaFraudeGlobal = true;
              motivoSospechaGlobal = "Similitud borderline / Posible captura de pantalla de otro dispositivo";
            }

            resultadoSimilitudGlobal = `${porcentajeSimilitud}% COINCIDENCIA`;
            status.innerText = `✓ Rostro Validado (${porcentajeSimilitud}% Coincidencia)`;
            status.className = "text-xs text-emerald-400 text-center font-semibold";
          } else {
            resultadoSimilitudGlobal = "MASTER_SIN_ROSTRO";
            status.innerText = "✓ Rostro Humano OK (Master ilegible)";
            status.className = "text-xs text-emerald-400 text-center font-semibold";
          }
        } catch (e) {
          console.warn("Error evaluando Foto Master:", e);
          resultadoSimilitudGlobal = "ERROR_EVALUACION";
        }
      } else {
        resultadoSimilitudGlobal = "SIN_MASTER";
        status.innerText = "✓ Rostro Humano Detectado (Sin foto master de cotejo)";
        status.className = "text-xs text-emerald-400 text-center font-semibold";
      }

      fotoBase64Global = canvas.toDataURL('image/jpeg', 0.35);
      preview.src = fotoBase64Global;
      preview.classList.remove('hidden');
    }

    function procesarEnvio(tipoRecibido) {
      const tipo = String(tipoRecibido).trim().toUpperCase();
      const legajo = document.getElementById('legajo').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const objetivo = document.getElementById('objetivo').value;

      if (!legajo || !pin || !objetivo) {
        alert("Por favor complete su N° de Legajo, PIN de Seguridad y seleccione un Objetivo.");
        return;
      }

      if (ultimoTipoFichadaGlobal === "ENTRADA" && tipo === "ENTRADA") {
        alert("⚠️ Acción bloqueada: Ya registraste una ENTRADA previa. No puedes volver a fichar entrada hasta registrar tu SALIDA.");
        const divRes = document.getElementById('resultado');
        divRes.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
        divRes.innerText = "❌ Bloqueado: Ya registraste una entrada anterior.";
        divRes.classList.remove('hidden');
        return;
      }

      localStorage.setItem('demo_ultimo_objetivo', objetivo);

      if (!fotoBase64Global) {
        alert("Primero capture una selfie válida haciendo clic en 'CAPTURAR Y VALIDAR ROSTRO'.");
        return;
      }

      const divResultado = document.getElementById('resultado');
      divResultado.className = "p-3 rounded-xl text-xs text-center bg-slate-700 text-white";
      divResultado.innerText = "Obteniendo ubicación GPS...";
      divResultado.classList.remove('hidden');

      if (!navigator.geolocation) {
        divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
        divResultado.innerText = "❌ El dispositivo/navegador no soporta localización GPS.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (!lat || !lng || lat === 0 || lng === 0) {
            divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
            divResultado.innerText = "❌ No se obtuvo una coordenada GPS válida. Activa la ubicación para fichar.";
            return;
          }

          ejecutarPeticionFichada(tipo, lat, lng, legajo, pin, nombre, objetivo);
        },
        err => {
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
          divResultado.innerText = "❌ Permiso de GPS denegado o no disponible. Activa la ubicación en tu dispositivo.";
        },
        { timeout: 5000, enableHighAccuracy: true }
      );
    }

    function ejecutarPeticionFichada(tipo, lat, lng, legajo, pin, nombre, objetivo) {
      const datos = {
        legajo: legajo,
        pin: pin,
        nombre: nombre || ("Legajo " + legajo),
        objetivo: objetivo,
        tipo: tipo,  
        latitud: lat,
        longitud: lng,
        mapa: `https://www.google.com/maps?q=${lat},${lng}`,
        fotoBase64: fotoBase64Global,
        validacionFacial: resultadoSimilitudGlobal,
        fechaHoraDispositivo: new Date().toISOString(),
        
        // CAMPOS Y BANDERAS DE AUDITORÍA Y ANTI-SPOOFING PARA EL PANEL ADMIN / SEGUNDO PLANO
        flashAntiSpoof: true,
        distanciaEuclidiana: distanciaEuclidianaGlobal,
        alertaFraude: sospechaFraudeGlobal,
        motivoFraude: motivoSospechaGlobal,
        estadoAuditoria: sospechaFraudeGlobal ? "EN_REVISION" : "OK"
      };

      const divResultado = document.getElementById('resultado');

      if (!navigator.onLine) {
        guardarFichadaOffline(datos, tipo, legajo);
        return;
      }

      divResultado.className = "p-3 rounded-xl text-xs text-center bg-slate-700 text-white";
      divResultado.innerText = "Registrando fichada...";
      divResultado.classList.remove('hidden');

      fetch(`${URL_FIREBASE}/fichadas.json`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      })
      .then(res => {
        if (!res.ok) throw new Error("Error en la respuesta de Firebase");
        return res.json();
      })
      .then(respuesta => {
        if (respuesta && respuesta.name) {
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-emerald-950 text-emerald-200 border border-emerald-500";
          divResultado.innerText = `✓ ¡Fichada de ${tipo} registrada con éxito!`;
          
          ultimoTipoFichadaGlobal = tipo;
          limpiarFormularioExitoso();
        } else {
          throw new Error("No se pudo confirmar el guardado en Firebase.");
        }
      })
      .catch(err => {
        console.warn("Fallo al conectar con Firebase. Guardando offline automáticamente...", err);
        guardarFichadaOffline(datos, tipo, legajo);
      });
    }

    function guardarFichadaOffline(datos, tipo, legajo) {
      let pendientes = JSON.parse(localStorage.getItem('fichadas_pendientes') || '[]');

      if (pendientes.length > 0) {
        let ultimaPendiente = pendientes[pendientes.length - 1];
        if (ultimaPendiente.legajo === legajo && ultimaPendiente.tipo === tipo) {
          const divResultado = document.getElementById('resultado');
          divResultado.className = "p-3 rounded-xl text-xs text-center bg-rose-950 text-rose-200 border border-rose-500";
          divResultado.innerText = `❌ Ya tienes una fichada de ${tipo} pendiente de sincronización. No puedes repetirla dos veces seguidas.`;
          return; 
        }
      }

      pendientes.push(datos);
      localStorage.setItem('fichadas_pendientes', JSON.stringify(pendientes));

      ultimoTipoFichadaGlobal = tipo;
      const divResultado = document.getElementById('resultado');
      divResultado.className = "p-3 rounded-xl text-xs text-center bg-amber-950 text-amber-200 border border-amber-500";
      divResultado.innerText = `⚠️ Sin conexión. Tu fichada de ${tipo} fue guardada en el dispositivo y se enviará al recuperar internet.`;

      limpiarFormularioExitoso();
    }

    function limpiarFormularioExitoso() {
      document.getElementById('pin').value = "";
      document.getElementById('legajo').value = "";
      document.getElementById('nombre').value = "";
      document.getElementById('legajo-status').className = "text-xs mt-1 hidden";
      document.getElementById('legajo-status').innerText = "";
      document.getElementById('ultimo-estado-badge').classList.add('hidden');
      
      fotoBase64Global = "";
      fotoMasterGuardada = null;
      resultadoSimilitudGlobal = "NO_EVALUADO";
      distanciaEuclidianaGlobal = null;
      sospechaFraudeGlobal = false;
      motivoSospechaGlobal = "";
      
      const preview = document.getElementById('preview');
      preview.src = "";
      preview.classList.add('hidden');
      
      const statusFoto = document.getElementById('foto-status');
      statusFoto.innerText = "⚠️ Foto no capturada";
      statusFoto.className = "text-xs text-rose-400 text-center font-semibold";

      iniciarCamaraSegura();
    }

    function sincronizarFichadasPendientes() {
      if (estaSincronizando) return; 
      let pendientes = JSON.parse(localStorage.getItem('fichadas_pendientes') || '[]');
      if (pendientes.length === 0) return;

      if (!navigator.onLine) return;

      estaSincronizando = true;
      let datos = pendientes.shift(); 
      localStorage.setItem('fichadas_pendientes', JSON.stringify(pendientes));

      fetch(`${URL_FIREBASE}/fichadas.json`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      })
      .then(res => res.json())
      .then(respuesta => {
        estaSincronizando = false;
        console.log("🔄 Fichada pendiente sincronizada con Firebase.");
        
        if (pendientes.length > 0) {
          sincronizarFichadasPendientes();
        }
      })
      .catch(err => {
        console.error("Error al sincronizar fichada pendiente, devolviéndola a la cola...", err);
        let actualizadas = JSON.parse(localStorage.getItem('fichadas_pendientes') || '[]');
        actualizadas.unshift(datos);
        localStorage.setItem('fichadas_pendientes', JSON.stringify(actualizadas));
        estaSincronizando = false;
      });
    }
  </script>
</body>
</html>
