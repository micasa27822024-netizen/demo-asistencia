<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Blindaje CSP: solo se permiten los orígenes que la app realmente usa. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com https://www.gstatic.com https://nominatim.openstreetmap.org https://vigix-auth-admin.micasa27822024.workers.dev; worker-src 'self' blob:; manifest-src 'self'">
  <title>Demo Asistencia - Control de Asistencia</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="styles.css">
  
  <!-- LIBRERÍA FACE-API.JS COMPLETA Y ESTABLE -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">


  <!-- ENCABEZADO Y MENÚ CORPORATIVO -->
  <header class="bg-slate-900 border-b border-slate-800 shadow-md mb-4">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-slate-800 border border-emerald-500/30 rounded-xl flex items-center justify-center overflow-hidden shadow-inner p-1">
          <i class="fa-solid fa-shield-halved text-white text-lg"></i>
        </div>
        <div>
          <span class="text-[10px] font-extrabold tracking-widest text-emerald-400 uppercase block">Demo Asistencia</span>
          <h1 class="text-lg font-bold text-white tracking-wide">Fichadas</h1>
        </div>
      </div>

      <nav class="flex flex-wrap justify-center items-center gap-1 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60">
        <a href="index.html" class="px-3 py-1.5 text-xs font-medium text-white bg-slate-700 rounded-lg transition flex items-center space-x-1.5 shadow-sm">
          <i class="fa-solid fa-camera-retro text-emerald-400"></i>
          <span>Fichadas</span>
        </a>
        <a href="admin.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-building-shield text-emerald-400"></i>
          <span>Centro de Operaciones</span>
        </a>
        <a href="panel.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-chart-line text-emerald-400"></i>
          <span>Control en Tiempo Real</span>
        </a>
        <a href="mis-horas.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-clock text-emerald-400"></i>
          <span>Control de Mis Horas</span>
        </a>
      </nav>

    </div>
  </header>

  <!-- ============ PANTALLA 1: BIENVENIDA / LOGIN ============ -->
  <main id="pantallaLogin" class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-5 text-center">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-wide">Bienvenido a Demo Asistencia</h1>
        <p class="text-sm text-slate-400 mt-1">Logueate para fichar</p>
      </div>
      <div class="flex justify-center">
        <span id="estadoRedLogin" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30">🟢 Online</span>
      </div>
      <form id="formLogin" class="space-y-4 text-left" autocomplete="off">
        <div>
          <label class="block text-xs uppercase text-slate-400 mb-1">N° Legajo</label>
          <input type="text" id="loginLegajo" inputmode="numeric" placeholder="Ingrese su legajo (ej: 0286)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs uppercase text-slate-400 mb-1">PIN / Clave de Personal</label>
          <input type="password" id="loginPin" maxlength="6" placeholder="****" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" id="btnIngresar" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition">Ingresar</button>
        <p id="login-status" class="text-xs mt-1 text-center hidden"></p>
      </form>
    </div>
  </main>

  <!-- ============ PANTALLA 2: FICHAJE (solo tras loguear) ============ -->
  <main id="panelFichaje" class="flex-grow flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-white tracking-wide uppercase">Registro de Asistencia</h2>
        <span id="estadoRed" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30">🟢 Online</span>
      </div>

      <div class="flex justify-between items-center bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2">
        <div class="text-left">
          <p class="text-[10px] uppercase text-slate-500 leading-tight">Sesión activa</p>
          <p id="lblSesionNombre" class="text-sm font-semibold text-emerald-300 leading-tight">—</p>
        </div>
        <button type="button" id="btnCerrarSesionVig" class="text-[11px] bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-1 rounded">
          <i class="fa-solid fa-right-from-bracket"></i> Salir
        </button>
      </div>

      <!-- LEGAJO (ya autenticado, solo lectura) -->
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">N° Legajo</label>
        <input type="text" id="legajo" readonly class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-300 cursor-not-allowed">
        <p id="legajo-status" class="text-xs mt-1 hidden"></p>
        <p id="ultimo-estado-badge" class="text-xs mt-1.5 font-semibold hidden"></p>
      </div>

      <!-- NOMBRE -->
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Nombre Completo</label>
        <input type="text" id="nombre" readonly placeholder="—" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-400 cursor-not-allowed">
      </div>

      <!-- OBJETIVO / PUESTO -->
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Objetivo / Puesto</label>
        <select id="objetivo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
          <option value="">Cargando objetivos...</option>
        </select>
        <p id="objetivo-status" class="text-[11px] mt-1 text-slate-500"></p>
        <p id="turno-status" class="text-[11px] mt-1 hidden"></p>
      </div>

      <!-- CÁMARA Y RECONOCIMIENTO FACIAL -->
      <div class="space-y-2">
        <label class="block text-xs uppercase text-slate-400">Validación Facial IA</label>
        <div class="relative w-full h-48 bg-slate-950 rounded-lg overflow-hidden border border-slate-700 flex items-center justify-center">
          <video id="webcam" autoplay playsinline class="w-full h-full object-cover -scale-x-100"></video>
          <canvas id="canvas" class="hidden"></canvas>
          <img id="preview" class="w-full h-full object-cover -scale-x-100 hidden absolute inset-0 border-2 border-emerald-500">
        </div>
        <button type="button" id="btnCapturar" class="w-full bg-amber-600 hover:bg-amber-500 text-xs py-2 rounded-lg font-bold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-camera"></i> CAPTURAR Y VALIDAR ROSTRO
        </button>
        <p id="foto-status" class="text-xs text-rose-400 text-center font-semibold">⚠️ Foto no capturada</p>
      </div>

      <!-- BOTONES DE ENVÍO -->
      <div class="grid grid-cols-2 gap-4 pt-2">
        <button id="btnEntrada" class="bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition">ENTRADA</button>
        <button id="btnSalida" class="bg-rose-600 hover:bg-rose-500 font-bold py-3 rounded-xl transition">SALIDA</button>
      </div>

      <div id="resultado" class="hidden p-3 rounded-xl text-xs text-center"></div>
    </div>
  </main>

  <script src="index.app.js"></script>

  <!-- ============================================================================= -->
  <!--  VERIFICACIÓN DE PIN DEL VIGILADOR - Firebase Auth (Web SDK v10 modular)       -->
  <!--  Bloque aditivo: el vigilador ficha con legajo + PIN validados en el servidor.-->
  <!-- ============================================================================= -->
  <script type="module" src="index.module.js"></script>
</body>
</html>
