<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Asistencia - Control de Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col relative">

  <div id="flash-overlay" class="fixed inset-0 bg-white pointer-events-none z-50 transition-opacity duration-100 opacity-0 hidden"></div>

  <header class="bg-slate-900 border-b border-slate-800 shadow-md mb-4">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-slate-800 border border-emerald-500/30 rounded-xl flex items-center justify-center overflow-hidden shadow-inner p-1">
          <i class="fa-solid fa-shield-halved text-white text-lg"></i>
        </div>
        <div>
          <span class="text-[10px] font-extrabold tracking-widest text-emerald-400 uppercase block">Demo Asistencia</span>
          <h1 class="text-lg font-bold text-white tracking-wide">Fichadas</h1>
        </div>
      </div>

      <nav class="flex flex-wrap justify-center items-center gap-1 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60">
        <a href="index.html" class="px-3 py-1.5 text-xs font-medium text-white bg-slate-700 rounded-lg transition flex items-center space-x-1.5 shadow-sm">
          <i class="fa-solid fa-camera-retro text-emerald-400"></i>
          <span>Fichadas</span>
        </a>
        <a href="admin.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-building-shield text-emerald-400"></i>
          <span>Centro de Operaciones</span>
        </a>
        <a href="panel.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-chart-line text-emerald-400"></i>
          <span>Control en Tiempo Real</span>
        </a>
        <a href="mis-horas.html" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700/50 rounded-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-clock text-emerald-400"></i>
          <span>Control de Mis Horas</span>
        </a>
      </nav>

    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-white tracking-wide uppercase">Registro de Asistencia</h2>
        <span id="estadoRed" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30">🟢 Online</span>
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">N° Legajo</label>
        <div class="relative">
          <input type="text" id="legajo" onblur="validarLegajo()" placeholder="Ingrese su legajo (ej: 0286)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
          <button type="button" onclick="validarLegajo()" class="absolute right-2 top-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2 py-1 rounded">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <p id="legajo-status" class="text-xs mt-1 hidden"></p>
        <p id="ultimo-estado-badge" class="text-xs mt-1.5 font-semibold hidden"></p>
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Nombre Completo</label>
        <input type="text" id="nombre" readonly placeholder="Se autocompletará con su legajo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-slate-400 cursor-not-allowed">
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">PIN / Clave de Personal</label>
        <input type="password" id="pin" maxlength="6" placeholder="****" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Objetivo / Puesto</label>
        <select id="objetivo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
          <option value="">Cargando objetivos...</option>
        </select>
      </div>

      <div class="space-y-2">
        <label class="block text-xs uppercase text-slate-400">Validación Facial IA</label>
        <div class="relative w-full h-48 bg-slate-950 rounded-lg overflow-hidden border border-slate-700 flex items-center justify-center">
          <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
          <canvas id="canvas" class="hidden"></canvas>
          <img id="preview" class="w-full h-full object-cover hidden absolute inset-0 border-2 border-emerald-500">
        </div>
        <button type="button" id="btnCapturar" onclick="capturarYValidarRostro()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-xs py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-camera"></i> CAPTURAR Y VALIDAR ROSTRO
        </button>
        <p id="foto-status" class="text-xs text-rose-400 text-center font-semibold">⚠️ Foto no capturada</p>
      </div>

      <div class="grid grid-cols-2 gap-4 pt-2">
        <button onclick="procesarEnvio('ENTRADA')" class="bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition">ENTRADA</button>
        <button onclick="procesarEnvio('SALIDA')" class="bg-rose-600 hover:bg-rose-500 font-bold py-3 rounded-xl transition">SALIDA</button>
      </div>

      <div id="resultado" class="hidden p-3 rounded-xl text-xs text-center"></div>
    </div>
  </main>

  <script>
    const URL_FIREBASE = "https://fir-asistencia-fad12-default-rtdb.firebaseio.com";
    
    let fotoBase64Global = "";
    let estaSincronizando = false;
    let ultimoTipoFichadaGlobal = "";
    let fotoMasterGuardada = null;
    let modelosCargados = false;
    let resultadoSimilitudGlobal = "NO_EVALUADO";
    
    let distanciaEuclidianaGlobal = null;
    let sospechaFraudeGlobal = false;
    let motivoSospechaGlobal = "";

    window.onload = async function() {
      iniciarCamaraSegura();
      cargarObjetivos();
      actualizarEstadoRed();
      cargarModelosIA();

      if (navigator.onLine) {
        sincronizarFichadasPendientes();
      }
    };

    async function cargarModelosIA() {
      const status = document.getElementById('foto-status');
      status.innerText = "⏳ Cargando modelos de IA...";
      status.className = "text-xs text-amber-400 text-center font-semibold";
      
      try {
        const MODEL_URL = './models';

        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        modelosCargados = true;
        status.innerText = "⚠️ Presione el botón para tomar la foto";
        status.className = "text-xs text-amber-400 text-center font-semibold";
      } catch (err) {
        console.error("Error al cargar modelos:", err);
        modelosCargados = false;
        status.innerText = "⚠️ Modo IA no disponible";
        status.className = "text-xs text-amber-400 text-center font-semibold";
      }
    }

    function iniciarCamaraSegura() {
      const status = document.getElementById('foto-status');
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
          .then(stream => { document.getElementById('webcam').srcObject = stream; })
          .catch(() => { status.innerText = "⚠️ Cámara no disponible"; });
      }
    }

    function actualizarEstadoRed() {
      const indicador = document.getElementById('estadoRed');
      if (!indicador) return;
      if (navigator.onLine) {
        indicador.className = "text-[11px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30";
        indicador.innerText = "🟢 Online";
      } else {
        indicador.className = "text-[11px] font-semibold px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-500/30";
        indicador.innerText = "⚠️ Modo Offline";
      }
    }

    function cargarObjetivos() {
      let objetivosGuardados = JSON.parse(localStorage.getItem('demo_lista_objetivos') || '[]');

      if (objetivosGuardados.length > 0) poblarSelectObjetivos(objetivosGuardados);

      if (navigator.onLine) {
        fetch(`${URL_FIREBASE}/objetivos.json`)
          .then(res => res.json())
          .then(data => {
            if (data) {
              let listaNuevos = [];
              Object.values(data).forEach(item => {
                const nombreObj = item.nombre || item.codigo;
                if (nombreObj) listaNuevos.push(nombreObj);
              });
              if (listaNuevos.length > 0) {
                localStorage.setItem('demo_lista_objetivos', JSON.stringify(listaNuevos));
                poblarSelectObjetivos(listaNuevos);
              }
            }
          })
          .catch(err => console.warn("Error cargando objetivos:", err));
      }
    }

    function poblarSelectObjetivos(lista) {
      const selectObj = document.getElementById('objetivo');
      let ultimoElegido = localStorage.getItem('demo_ultimo_objetivo') || '';
      selectObj.innerHTML = '<option value="">Seleccione un Objetivo</option>';
      lista.forEach(nombreObj => {
        const opt = document.createElement('option');
        opt.value = nombreObj;
        opt.textContent = nombreObj;
        if (nombreObj === ultimoElegido) opt.selected = true;
        selectObj.appendChild(opt);
      });
    }

    function validarLegajo() {
      const legajoInput = document.getElementById('legajo').value.trim();
      const statusLbl = document.getElementById('legajo-status');
      fotoMasterGuardada = null;
      if (!legajoInput) return;

      if (!navigator.onLine) {
        statusLbl.className = "text-xs mt-1 text-slate-400 block";
        statusLbl.innerText = "Modo Offline: Verificación en servidor omitida.";
        return;
      }

      statusLbl.className = "text-xs mt-1 text-amber-400 block";
      statusLbl.innerText = "Buscando legajo...";

      fetch(`${URL_FIREBASE}/personal.json`)
        .then(res => res.json())
        .then(dataPersonal => {
          let encontrado = null;
          if (dataPersonal) {
            if (dataPersonal[legajoInput]) encontrado = dataPersonal[legajoInput];
            else {
              Object.values(dataPersonal).forEach(p => {
                if (String(p.legajo).trim() === String(legajoInput)) encontrado = p;
              });
            }
          }

          if (encontrado) {
            document.getElementById('nombre').value = encontrado.nombre || "";
            fotoMasterGuardada = encontrado.fotoMaster || null;
            statusLbl.className = "text-xs mt-1 text-emerald-400 block";
            statusLbl.innerText = `✓ ${encontrado.nombre || 'Legajo OK'} ${fotoMasterGuardada ? '📸' : '⚠️ (Sin Foto Master)'}`;
          } else {
            document.getElementById('nombre').value = "";
            statusLbl.className = "text-xs mt-1 text-rose-400 block";
            statusLbl.innerText = "❌ Legajo no encontrado.";
          }
        });
    }

    // ANALIZADOR DE TEXTURA EN SEGUNDO PLANO PARA PANTALLAS O FOTOS HD
    function analizarTexturaSuperficial(ctx, box) {
      const x = Math.max(0, Math.floor(box.x));
      const y = Math.max(0, Math.floor(box.y));
      const w = Math.min(ctx.canvas.width - x, Math.floor(box.width));
      const h = Math.min(ctx.canvas.height - y, Math.floor(box.height));

      if (w <= 0 || h <= 0) return 0;

      const imageData = ctx.getImageData(x, y, w, h);
      const data = imageData.data;
      let variacionTotal = 0;

      for (let i = 0; i < data.length - 4; i += 4) {
        const brilloActual = (data[i] + data[i+1] + data[i+2]) / 3;
        const brilloSiguiente = (data[i+4] + data[i+5] + data[i+6]) / 3;
        variacionTotal += Math.abs(brilloActual - brilloSiguiente);
      }

      return variacionTotal / (data.length / 4);
    }

    // CAPTURA DIRECTA Y ESCANEO EN SEGUNDO PLANO
    async function capturarYValidarRostro() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const preview = document.getElementById('preview');
      const status = document.getElementById('foto-status');

      if (!fotoMasterGuardada) {
        alert("El legajo no tiene Foto Máster registrada o no fue validado.");
        return;
      }

      status.innerText = "⏳ Capturando y analizando rostros...";
      status.className = "text-xs text-amber-400 text-center font-semibold animate-pulse";

      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 640, 480);

      // 1. DETECCIÓN DE ROSTRO EN LA SELFIE
      const deteccionSelfie = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.25 }))
                                          .withFaceLandmarks()
                                          .withFaceDescriptor();

      if (!deteccionSelfie) {
        status.innerText = "❌ Rostro no detectado o mala iluminación.";
        status.className = "text-xs text-rose-400 text-center font-semibold";
        fotoBase64Global = "";
        preview.classList.add('hidden');
        return;
      }

      const box = deteccionSelfie.detection.box;

      // 2. FILTRO DE TAMAÑO RELATIVO (Previene fotos pequeñas o distanciadas)
      const altoRelativo = box.height / canvas.height;
      if (altoRelativo < 0.28) {
        status.innerText = "❌ FRAUDE: Acerque la cara a la cámara. No sostenga fotos ni pantallas lejos.";
        status.className = "text-xs text-rose-400 text-center font-bold";
        sospechaFraudeGlobal = true;
        motivoSospechaGlobal = "Cara de tamaño muy reducido en el encuadre (posible papel/pantalla distanciada)";
        fotoBase64Global = "";
        preview.classList.add('hidden');
        return;
      }

      // 3. FILTRO DE MARCOS / BORDES BLANCOS SATURADOS DE HOJA/PANTALLA
      const startX = Math.max(0, box.x - 30);
      const startY = Math.max(0, box.y - 30);
      const width = Math.min(canvas.width - startX, box.width + 60);
      const height = Math.min(canvas.height - startY, box.height + 60);
      
      const imgData = ctx.getImageData(startX, startY, width, height);
      let pixelesSaturados = 0;
      for (let i = 0; i < imgData.data.length; i += 4) {
        if (imgData.data[i] > 235 && imgData.data[i+1] > 235 && imgData.data[i+2] > 235) {
          pixelesSaturados++;
        }
      }
      if ((pixelesSaturados / (imgData.data.length / 4)) > 0.18) {
        status.innerText = "❌ FRAUDE DETECTADO: Se identificaron bordes de papel o pantalla alrededor del rostro.";
        status.className = "text-xs text-rose-400 text-center font-bold";
        sospechaFraudeGlobal = true;
        motivoSospechaGlobal = "Bordes blancos/marcos de hoja impresos envolventes";
        fotoBase64Global = "";
        preview.classList.add('hidden');
        return;
      }

      // 4. COMPARACIÓN BIOMÉTRICA CON LA FOTO MÁSTER
      try {
        const imgMaster = new Image();
        imgMaster.crossOrigin = "anonymous";
        imgMaster.src = fotoMasterGuardada;
        await imgMaster.decode();

        const deteccionMaster = await faceapi.detectSingleFace(imgMaster, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.25 }))
                                             .withFaceLandmarks()
                                             .withFaceDescriptor();

        if (deteccionMaster) {
          const distancia = faceapi.euclideanDistance(deteccionSelfie.descriptor, deteccionMaster.descriptor);
          const porcentaje = Math.round((1 - distancia) * 100);
          distanciaEuclidianaGlobal = distancia.toFixed(4);

          // 5. UMBRAL OBLIGATORIO DE FICHAJE: MÍNIMO 55% DE COINCIDENCIA (distancia <= 0.45)
          if (distancia > 0.45) {
            status.innerText = `❌ RECHAZADO: Coincidencia insuficiente (${porcentaje}%). Requerido: 55%.`;
            status.className = "text-xs text-rose-400 text-center font-bold";
            resultadoSimilitudGlobal = `${porcentaje}% COINCIDENCIA (RECHAZADO)`;
            sospechaFraudeGlobal = true;
            motivoSospechaGlobal = `No supera el umbral del 55% de coincidencia (${porcentaje}%)`;
            fotoBase64Global = "";
            preview.classList.add('hidden');
            return;
          }

          // 6. ESCANEO MINUCIOSO EN SEGUNDO PLANO (Evaluación de textura para pantallas HD)
          const nivelTextura = analizarTexturaSuperficial(ctx, box);
          const sospechaPantallaHD = nivelTextura < 10;

          sospechaFraudeGlobal = sospechaPantallaHD;
          motivoSospechaGlobal = sospechaPantallaHD ? "Patrón de textura plano detectado en segundo plano (Posible pantalla HD)" : "Verificación limpia";
          resultadoSimilitudGlobal = `${porcentaje}% COINCIDENCIA`;

          status.innerText = `✓ Rostro Validado (${porcentaje}% Coincidencia)`;
          status.className = "text-xs text-emerald-400 text-center font-semibold";

          fotoBase64Global = canvas.toDataURL('image/jpeg', 0.45);
          preview.src = fotoBase64Global;
          preview.classList.remove('hidden');

        } else {
          status.innerText = "⚠️ La foto máster guardada no se puede comparar.";
          status.className = "text-xs text-amber-400 text-center font-semibold";
        }
      } catch (e) {
        console.error(e);
        status.innerText = "⚠️ Error durante la comparación de biometría.";
        status.className = "text-xs text-amber-400 text-center font-semibold";
      }
    }

    function procesarEnvio(tipoRecibido) {
      const tipo = String(tipoRecibido).trim().toUpperCase();
      const legajo = document.getElementById('legajo').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const objetivo = document.getElementById('objetivo').value;

      if (!legajo || !pin || !objetivo) {
        alert("Complete N° Legajo, PIN y Objetivo.");
        return;
      }

      if (!fotoBase64Global) {
        alert("Primero debe capturar y validar su rostro (mínimo 55% de coincidencia).");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          ejecutarPeticionFichada(tipo, pos.coords.latitude, pos.coords.longitude, legajo, pin, nombre, objetivo);
        },
        () => alert("Active el GPS para fichar."),
        { timeout: 5000, enableHighAccuracy: true }
      );
    }

    function ejecutarPeticionFichada(tipo, lat, lng, legajo, pin, nombre, objetivo) {
      const datos = {
        legajo, pin, nombre, objetivo, tipo,
        latitud: lat, longitud: lng,
        mapa: `https://www.google.com/maps?q=${lat},${lng}`,
        fotoBase64: fotoBase64Global,
        validacionFacial: resultadoSimilitudGlobal,
        distanciaEuclidiana: distanciaEuclidianaGlobal,
        fechaHoraDispositivo: new Date().toISOString(),
        alertaFraude: sospechaFraudeGlobal,
        motivoFraude: motivoSospechaGlobal
      };

      fetch(`${URL_FIREBASE}/fichadas.json`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      })
      .then(() => {
        document.getElementById('resultado').innerText = `✓ Fichada de ${tipo} registrada con éxito.`;
        document.getElementById('resultado').className = "p-3 rounded-xl text-xs text-center bg-emerald-950 text-emerald-200 border border-emerald-500 block";
      });
    }

    function sincronizarFichadasPendientes() {
      // Función reservada para soporte offline
    }
  </script>
</body>
</html>
